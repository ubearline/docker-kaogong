name: merge-tar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-tar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge split parts into full tar
        run: cat gongkao-naoku.tar.part-* > gongkao-naoku.tar

      - name: Verify MD5
        run: |
          echo "b338cba0396ee97235992e46b2819ae9  gongkao-naoku.tar" | md5sum -c -

      - name: Show result
        run: ls -lh gongkao-naoku.tar && md5sum gongkao-naoku.tar

      - name: Upload merged tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: gongkao-naoku.tar
          path: gongkao-naoku.tar
          retention-days: 30
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: gongkao-naoku.tar (latest)
          body: |
            自动合并产物（CI 生成）。

            - 文件：`gongkao-naoku.tar`（约 190MB，可直接 `docker load -i`）
            - MD5：`b338cba0396ee97235992e46b2819ae9`
            - 生成源：`merge-tar` workflow · ${{ github.sha }}
          files: gongkao-naoku.tar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
