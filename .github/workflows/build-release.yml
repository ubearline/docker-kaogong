name: Merge tar release

# 手动触发，或改动分卷/脚本时触发；打 tag v* 也触发
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gongkao-naoku.tar.part-*'
      - 'merge_gongkao.sh'
      - '.github/workflows/**'
    tags: ['v*']

permissions:
  contents: write   # 创建 release 需要

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge parts & verify md5
        run: |
          cat gongkao-naoku.tar.part-* > gongkao-naoku.tar
          EXPECT=$(grep -oP 'MD5=\K[0-9a-f]+' merge_gongkao.sh)
          ACTUAL=$(md5sum gongkao-naoku.tar | awk '{print $1}')
          echo "expected=$EXPECT actual=$ACTUAL"
          [ "$ACTUAL" = "$EXPECT" ] || { echo "md5 校验失败"; exit 1; }
          md5sum gongkao-naoku.tar | tee gongkao-naoku.tar.md5

      - name: Verify tar is a docker image
        run: docker load -i gongkao-naoku.tar

      - name: Upload artifact (每次运行都留档)
        uses: actions/upload-artifact@v4
        with:
          name: gongkao-naoku.tar
          path: |
            gongkao-naoku.tar
            gongkao-naoku.tar.md5

      - name: Release (仅 tag 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gongkao-naoku.tar
            gongkao-naoku.tar.md5
          generate_release_notes: true
