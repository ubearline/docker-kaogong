name: Build image tar release

# 手动触发，或改动构建相关文件时触发；打 tag v* 也触发
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'merge_gongkao.sh'
      - 'README.md'
      - '.github/workflows/**'
    tags: ['v*']

permissions:
  contents: write   # 创建 release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t gongkao-naoku:latest .

      - name: Export tar
        run: |
          docker save gongkao-naoku:latest -o gongkao-naoku.tar
          md5sum gongkao-naoku.tar | tee gongkao-naoku.tar.md5

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8300:8300 gongkao-naoku:latest
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8300/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || { docker logs smoke; exit 1; }
          docker rm -f smoke >/dev/null
          echo "首页 HTTP 200，冒烟通过"

      - name: Upload artifact (每次运行都留档)
        uses: actions/upload-artifact@v4
        with:
          name: gongkao-naoku.tar
          path: |
            gongkao-naoku.tar
            gongkao-naoku.tar.md5

      - name: Release (仅 tag 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gongkao-naoku.tar
            gongkao-naoku.tar.md5
          generate_release_notes: true
